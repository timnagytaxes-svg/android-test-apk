name: Build Godot APK

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/build-godot.yml'
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GODOT_VERSION: '4.4.1'
      GODOT_RELEASE: '4.4.1.stable'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Download Godot and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/${GODOT_RELEASE}"
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot/editor.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot/editor.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot/templates.tpz" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp -a "$RUNNER_TEMP/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/${GODOT_RELEASE}/"
      - name: Configure Godot SDK and debug signing
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore godot/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
      - name: Verify Android tools and Godot templates
        shell: bash
        run: |
          set -euo pipefail
          test -x "${ANDROID_HOME}/platform-tools/adb"
          test -d "${JAVA_HOME}"
          test -s "$HOME/.local/share/godot/export_templates/${GODOT_RELEASE}/android_debug.apk"
          test -s godot/debug.keystore
          test -s "$HOME/.config/godot/editor_settings-4.4.tres"
          echo "Android SDK and export templates present"
      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --editor --path godot --import --quit 2>&1 | tee /tmp/godot-import.txt
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-import.txt; then exit 1; fi
      - name: Run modular system tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path godot --script res://tests/test_modules.gd | tee /tmp/godot-test-results.txt
          grep -q "ALL MODULE TESTS PASSED" /tmp/godot-test-results.txt
      - name: Run v0.3 combat targeting AI and equipment tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path godot --script res://v03/tests/smoke.gd 2>&1 | tee /tmp/v03-tests.txt
          grep -q "V03 ALL BATTLE TESTS PASSED" /tmp/v03-tests.txt
          if grep -E 'SCRIPT ERROR|Parse Error|FAIL V03:' /tmp/v03-tests.txt; then exit 1; fi
      - name: Run v0.4 secure dice class progression tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path godot --script res://v04/tests/smoke.gd 2>&1 | tee /tmp/v04-tests.txt
          grep -q "V04 ALL PROGRESSION AND SECURE DICE TESTS PASSED" /tmp/v04-tests.txt
          if grep -E 'SCRIPT ERROR|Parse Error|FAIL V04:' /tmp/v04-tests.txt; then exit 1; fi
      - name: Run v0.5 world navigation quest and encounter tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path godot --script res://v05/tests/smoke.gd 2>&1 | tee /tmp/v05-tests.txt
          grep -q "V05 WORLD QUESTS AND ENCOUNTER TESTS PASSED" /tmp/v05-tests.txt
          if grep -E 'SCRIPT ERROR|Parse Error|FAIL V05:' /tmp/v05-tests.txt; then exit 1; fi
      - name: Run v0.5 world to battle UI integration tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 50s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path godot --script res://v05/tests/ui_smoke.gd 2>&1 | tee /tmp/v05-ui-tests.txt
          grep -q "V05 UI BATTLE TRANSITION TESTS PASSED" /tmp/v05-ui-tests.txt
          if grep -E 'SCRIPT ERROR|Parse Error|FAIL V05 UI:' /tmp/v05-ui-tests.txt; then exit 1; fi
      - name: Run v0.6 adventure economy and boss tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 65s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path godot --script res://v06/tests/rules.gd 2>&1 | tee /tmp/v06-rules.txt
          grep -q "V06 CAMPAIGN ECONOMY AND BATTLE RULES PASSED" /tmp/v06-rules.txt
          if grep -E 'SCRIPT ERROR|Parse Error|FAIL V06:' /tmp/v06-rules.txt; then exit 1; fi
      - name: Run v0.6 automatic turns and world UI tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 65s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path godot --script res://v06/tests/ui.gd 2>&1 | tee /tmp/v06-ui.txt
          grep -q "V06 AUTO FLOW AND UI INTEGRATION PASSED" /tmp/v06-ui.txt
          if grep -E 'SCRIPT ERROR|Parse Error|FAIL V06 UI:' /tmp/v06-ui.txt; then exit 1; fi
      - name: Check main scene boots
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path godot --quit-after 5 2>&1 | tee /tmp/godot-boot.txt
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access' /tmp/godot-boot.txt; then exit 1; fi
      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$GITHUB_WORKSPACE/godot/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --verbose --path godot --export-debug "Android" "$GITHUB_WORKSPACE/build/Ironbound_Chronicles_v0_6.apk" 2>&1 | tee /tmp/godot-export.txt
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/godot-export.txt; then exit 1; fi
          test -s build/Ironbound_Chronicles_v0_6.apk
      - name: Upload Godot APK
        uses: actions/upload-artifact@v4
        with:
          name: ironbound-chronicles-v06
          path: build/Ironbound_Chronicles_v0_6.apk
          if-no-files-found: error
